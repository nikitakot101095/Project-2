<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Слайдер изображений</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="slider">
    <div class="slider__viewport">
      <img id="slide-image" src="images/1.jpg" alt="Изображение 1">
    </div>

    
    <div class="slider__controls">
      <button id="prev-btn" class="slider__btn">← Назад</button>
      <span id="counter" class="slider__counter">Изображение 1 из 5</span>
      <button id="next-btn" class="slider__btn">Вперёд →</button>
    </div>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
